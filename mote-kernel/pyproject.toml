[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mote-kernel"
dynamic = ["version"]
description = "A durable, state-machine-driven agent kernel."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mote contributors" }]
keywords = ["agent", "ai", "workflow", "state-machine", "durable-execution"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "detect-secrets>=1.5",
  "hatchling>=1.27",
  "pip-audit>=2.8",
  "pre-commit>=4.0",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mote_kernel"]
artifacts = ["src/mote_kernel/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/example/__init__.py",
  "/example/graph",
  "/docs",
  "/third_party_licenses",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/README.zh-CN.md",
  "/pyproject.toml",
]

[tool.hatch.version]
path = "src/mote_kernel/__init__.py"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "strict"

[tool.coverage.run]
branch = true
source = ["mote_kernel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
extend-exclude = ["example/**/*.md"]
line-length = 120
src = ["src", "tests", "example"]
target-version = "py311"

[tool.ruff.lint]
select = ["A", "ANN", "ASYNC", "B", "C4", "E", "F", "FA", "I", "N", "PERF", "PIE", "PTH", "RET", "RUF", "SIM", "T20", "UP", "W"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]
"tests/execution/test_graph_examples.py" = ["RUF001"]
"example/**/*.py" = ["RUF001", "RUF002", "T201"]
"src/mote_kernel/logging/__init__.py" = ["A005"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

# High-recall indicators are independently ratcheted: every improvement becomes
# the new ceiling, while regressions require an explicit architecture decision.
# The 2026-09-03 package-wide audit is recorded in
# docs/graph-delayed-loop-implementation-plan.zh-CN.md#143-p1-收口架构审计.
# The 2026-09-03 ledger-admission defense adds one compiled-topology check;
# its measured structural cost is ratcheted here rather than hidden or suppressed.
# P3-M2 adds the topology-owned target lookup needed to retain every typed
# feedback binding; the compiler/routing change removes the previous target-map
# helper and is ratcheted at its measured net shape.
# The P3-M1 review hardening distinguishes a conservative route-domain summary
# from an exact Join proof and propagates START-plus-incoming repeatability.  Its
# measured compiler cost is retained here after the proof model review.
# P3-M3 replaces the definition-only Join key with one State-owned occurrence
# identity and compiler-owned source-to-target projection.  The added identity,
# plan, control-resolution, reducer, and recovery-admission checks are the one
# typed path for both acyclic and cyclic Join execution; their reviewed net
# shape is ratcheted here without merging construction and recovery defenses.
# P3-M4 drives the parent session and active child owners concurrently under one
# family owner.  Explicit worker lifecycle, cancellation, and unstarted-
# coroutine cleanup preserve owner-local and distributed admission defenses;
# their reviewed net shape is ratcheted here without adding a second scheduler.
# The P3-M4/P3-M5 failure boundary fences every settled family owner after an
# ordinary worker failure, while preserving commit-origin leases and the
# original exception.  Its recursive owner cleanup is ratcheted at the
# isolated Graph shape rather than hidden behind a compatibility path.
# Invocation-backed Logging, Observability, and Events Ports add one shared
# policy seam and explicit async boundaries.  The cancellation distinction in
# best-effort delivery was reviewed as the diagnostic exception boundary.  The
# three domain Ports remain separate owners (rather than a generic port base),
# and the post-outcome guards remain at their primary-outcome owners; this
# measured shape is ratcheted rather than hidden behind aliases or tasks.
# Graph.feedback adds one deliberate method to the sole public facade and
# removes the facade-only rejection normalizer; its canonical binding/compiler
# path is ratcheted at the resulting measured shape.
# The atomic Graph commit boundary now has one complete owner in
# execution/commit.py: typed write-set construction, exact acknowledgement,
# and post-confirmation frame staging stay together instead of being hidden in
# family-driver wiring.  The resulting measured shape is ratcheted as an
# intentional ownership boundary, not reduced through aliases or wrappers.
