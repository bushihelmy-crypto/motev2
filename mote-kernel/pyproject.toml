[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mote-kernel"
dynamic = ["version"]
description = "A durable, state-machine-driven agent kernel."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mote contributors" }]
keywords = ["agent", "ai", "workflow", "state-machine", "durable-execution"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "detect-secrets>=1.5",
  "hatchling>=1.27",
  "pip-audit>=2.8",
  "pre-commit>=4.0",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mote_kernel"]
artifacts = ["src/mote_kernel/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/example/__init__.py",
  "/example/graph",
  "/docs",
  "/third_party_licenses",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/README.zh-CN.md",
  "/pyproject.toml",
]

[tool.hatch.version]
path = "src/mote_kernel/__init__.py"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "strict"

[tool.coverage.run]
branch = true
source = ["mote_kernel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
extend-exclude = ["example/**/*.md"]
line-length = 120
src = ["src", "tests", "example"]
target-version = "py311"

[tool.ruff.lint]
select = ["A", "ANN", "ASYNC", "B", "C4", "E", "F", "FA", "I", "N", "PERF", "PIE", "PTH", "RET", "RUF", "SIM", "T20", "UP", "W"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]
"tests/execution/test_graph_examples.py" = ["RUF001"]
"example/**/*.py" = ["RUF001", "RUF002", "T201"]
"src/mote_kernel/logging/__init__.py" = ["A005"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

# The ratchet keeps legacy debt from growing. It is not a health target.
[tool.mote_kernel.complexity_ratchet]
top_level_definitions = 499
type_definitions = 290
dataclass_types = 172
dataclass_fields = 485
decision_points = 1366
logical_clone_pairs = 10
record_shape_clone_pairs = 20
thin_single_use_helpers = 14
single_use_private_dataclasses = 1
test_only_private_definitions = 0

# Unreviewed structural-smell targets are zero. `make complexity` checks these
# targets; `make complexity-ratchet` is the non-regression CI gate.
[tool.mote_kernel.complexity_health]
logical_clone_pairs = 0
record_shape_clone_pairs = 0
thin_single_use_helpers = 0
single_use_private_dataclasses = 0
test_only_private_definitions = 0

# These identities are reviewed, intentional nominal-owner boundaries. The
