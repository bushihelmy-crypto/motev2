[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mote-kernel"
dynamic = ["version"]
description = "A durable, state-machine-driven agent kernel."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mote contributors" }]
keywords = ["agent", "ai", "workflow", "state-machine", "durable-execution"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "detect-secrets>=1.5",
  "hatchling>=1.27",
  "pip-audit>=2.8",
  "pre-commit>=4.0",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mote_kernel"]
artifacts = ["src/mote_kernel/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/example/__init__.py",
  "/example/graph",
  "/docs",
  "/third_party_licenses",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/README.zh-CN.md",
  "/pyproject.toml",
]

[tool.hatch.version]
path = "src/mote_kernel/__init__.py"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "strict"

[tool.coverage.run]
branch = true
source = ["mote_kernel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
extend-exclude = ["example/**/*.md"]
line-length = 120
src = ["src", "tests", "example"]
target-version = "py311"

[tool.ruff.lint]
select = ["A", "ANN", "ASYNC", "B", "C4", "E", "F", "FA", "I", "N", "PERF", "PIE", "PTH", "RET", "RUF", "SIM", "T20", "UP", "W"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]
"tests/execution/test_graph_examples.py" = ["RUF001"]
"example/**/*.py" = ["RUF001", "RUF002", "T201"]
"src/mote_kernel/logging/__init__.py" = ["A005"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

# High-recall indicators are independently ratcheted: every improvement becomes
# the new ceiling, while regressions require an explicit architecture decision.
# The 2026-09-03 package-wide audit is recorded in
# docs/graph-delayed-loop-implementation-plan.zh-CN.md#143-p1-收口架构审计.
# The 2026-09-03 ledger-admission defense adds one compiled-topology check;
# its measured structural cost is ratcheted here rather than hidden or suppressed.
# P3-M2 added topology-owned activation gates; the causal-output redesign now
# reuses those gates to compile every possible predecessor directly into each
# input binding, removing the feedback-specific target map and execution path.
# The P3-M1 review hardening distinguishes a conservative route-domain summary
# from an exact Join proof and propagates START-plus-incoming repeatability.  Its
# measured compiler cost is retained here after the proof model review.
# P3-M3 replaces the definition-only Join key with one State-owned occurrence
# identity and compiler-owned source-to-target projection.  The added identity,
# plan, control-resolution, reducer, and recovery-admission checks are the one
# typed path for both acyclic and cyclic Join execution; their reviewed net
# shape is ratcheted here without merging construction and recovery defenses.
# P3-M4 drives the parent session and active child owners concurrently under one
# family owner.  Explicit worker lifecycle, cancellation, and unstarted-
# coroutine cleanup preserve owner-local and distributed admission defenses;
# their reviewed net shape is ratcheted here without adding a second scheduler.
# The P3-M4/P3-M5 failure boundary fences every settled family owner after an
# ordinary worker failure, while preserving commit-origin leases and the
# original exception.  Its recursive owner cleanup is ratcheted at the
# isolated Graph shape rather than hidden behind a compatibility path.
# Invocation-backed Logging, Observability, and Events Ports add one shared
# policy seam and explicit async boundaries.  The cancellation distinction in
# best-effort delivery was reviewed as the diagnostic exception boundary.  The
# three domain Ports remain separate owners (rather than a generic port base),
# and the post-outcome guards remain at their primary-outcome owners; this
# measured shape is ratcheted rather than hidden behind aliases or tasks.
# Graph.node_output has one overloaded public method: two arguments select a
# fixed producer, while one selects the activation's actual predecessor.  The
# extra overload definition is ratcheted together with the large reduction in
# feedback-specific compiler and runtime machinery.
# Failover keeps the status/error-hint table in its policy owner and leaves
# profiles with parameters only; removing configurable duplicate rules and the
# cursor's copied budget locks in the resulting smaller single-truth model.
# The Failover Port decorator assembles four domain stages plus one terminal
# projection directly on the canonical Graph.  Typed phase values preserve
# durable control facts.  Provider version checks and existing-result lookups
# remain wholly inside the wrapped Port; the Kernel has no reconciliation path.
# Hook execution is deliberately absent from this topology.  The reviewed cost
# is ratcheted here rather than hidden in a runner or optional-field state machine.
# The atomic Graph commit boundary now has one complete owner in
# execution/commit.py: typed write-set construction, exact acknowledgement,
# and post-confirmation frame staging stay together instead of being hidden in
# family-driver wiring.  The resulting measured shape is ratcheted as an
# intentional ownership boundary, not reduced through aliases or wrappers.
# The 2026-09-07 integrated call-chain review covers the typed Graph facade and
# the Hook, Act, Think, and Observe assemblies now present in this branch.  It
# removed the facade's duplicate boundary mini-compiler, the second typed-input
# lowering path, duplicate nominal-type rules, repeated Observe capability
# admission, unused Act admission surfaces, and execution-time missing-Port
# defenses after required Think capabilities have passed assembly.  Compiler,
# Port, and domain exception owners remain distinct; no compatibility path or
# metric-only forwarding abstraction was added.  The one thin continuation
# predicate deliberately shields the facade from a private snapshot variant.
# The same review then collapsed callable and typed nodes into one compiled
# invoker IR, made family compilation one memoized compiler session, removed
# definition-scope mirrors from immutable plans, and replaced nested child
# tuples plus closure handles with one explicit _ChildCall lifecycle owner.
# The resulting six extra attribute writes and three stateful async methods are
# the visible child phase/owner transitions that had previously been hidden in
# closure cells plus the compiler session's root/cache ownership; the two import
# edges keep compilation and node adaptation in their existing narrow owner
# modules.  They are retained as reviewed ownership cost while every measured
# reduction below is ratcheted immediately.
# The 2026-09-07 successor review then made the route-independent control
# successor relation a single compiler rule shared by topology proof and
# compilation.  Route-sensitive event expansion and Join augmentation remain
# separate because they have different proof boundaries; this removes their
# duplicated static successor derivation without introducing a second topology
# model.
# The follow-up call-chain review keeps Join/end declarations immutable once
# parsed, evaluates reachability before Join augmentation, and makes the
# compiled input-binding coordinate (including predecessor provenance) one
# owner shared by availability and materialization.  Single-use routing and
# override forwarding layers were removed; frame lookup and error boundaries
# remain typed and local to their existing owners.
# This pass keeps the compiler's node/input/control phases explicit (each phase
# has one typed owner and preserves validation order), while lowering edge
# normalization to one endpoint path.  Joint-path analysis now reuses the
# already-expanded successor relation instead of rebuilding it.  Recovery's
# historical Join index likewise keys each source occurrence once; these are
# structural ownership/performance changes, not threshold-only helper splits.
# Think model selection is now one explicit Router node because the external
# Router Runtime call needs its own durable recovery, cancellation, Hook, and
# audit boundary before inference.  Its required typed Port replaces the static
# assembly-time model binding; RouterStep carries the selected immutable model
# through the existing Graph snapshot without adding another runner or state
# owner.  The request, step, node-input, Port contract/adapter, and callable are
# distinct boundary owners, so their measured structural cost is retained.
# Port declaration normalization now has one shared canonical-name/mapping
# owner; each public normalizer keeps its own value-domain admission and
# exception boundary.  The small owner cost is retained because it removes
# three repeated declaration loops and one normalized near-clone shape.
# Contract-edge exception constructors use their fixed ValueError/Exception
# owners directly; Hook tuple admission is a validation-only operation, so it
# carries the existing CommandT element relation without a pseudo-narrowed
# return.  The four resulting annotation nodes are retained as the explicit
# typed boundary cost.
# The 2026-09-09 full-kernel review then checked the current branch shape across
# Config, Hook, Act, Think, Observe, Loop, and Failover.  The older checked-in
# ceiling predated those already-accepted typed projections and boundary tests;
# this pass removes duplicate Port-set/decorator paths and activation-time
# normalization while preserving each domain's error boundary.  The values
# below are the exact post-review measurement (not a blanket allowance): future
# reductions must lower them immediately, and any growth still requires the
# same owner/call-chain review.
