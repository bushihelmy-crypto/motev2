[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mote-kernel"
dynamic = ["version"]
description = "A durable, state-machine-driven agent kernel."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mote contributors" }]
keywords = ["agent", "ai", "workflow", "state-machine", "durable-execution"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "detect-secrets>=1.5",
  "hatchling>=1.27",
  "pip-audit>=2.8",
  "pre-commit>=4.0",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mote_kernel"]
artifacts = ["src/mote_kernel/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/example/__init__.py",
  "/example/graph",
  "/docs",
  "/third_party_licenses",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/README.zh-CN.md",
  "/pyproject.toml",
]

[tool.hatch.version]
path = "src/mote_kernel/__init__.py"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "strict"

[tool.coverage.run]
branch = true
source = ["mote_kernel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
extend-exclude = ["example/**/*.md"]
line-length = 120
src = ["src", "tests", "example"]
target-version = "py311"

[tool.ruff.lint]
select = ["A", "ANN", "ASYNC", "B", "C4", "E", "F", "FA", "I", "N", "PERF", "PIE", "PTH", "RET", "RUF", "SIM", "T20", "UP", "W"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]
"tests/execution/test_graph_examples.py" = ["RUF001"]
"example/**/*.py" = ["RUF001", "RUF002", "T201"]
"src/mote_kernel/logging/__init__.py" = ["A005"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

# High-recall indicators are independently ratcheted: every improvement becomes
# the new ceiling, while regressions require an explicit architecture decision.
# The 2026-09-03 package-wide audit is recorded in
# docs/graph-delayed-loop-implementation-plan.zh-CN.md#143-p1-收口架构审计.
# The 2026-09-03 ledger-admission defense adds one compiled-topology check;
# its measured structural cost is ratcheted here rather than hidden or suppressed.
# P3-M2 adds the topology-owned target lookup needed to retain every typed
# feedback binding; the compiler/routing change removes the previous target-map
# helper and is ratcheted at its measured net shape.
# The P3-M1 review hardening distinguishes a conservative route-domain summary
# from an exact Join proof and propagates START-plus-incoming repeatability.  Its
# measured compiler cost is retained here after the proof model review.
# P3-M3 replaces the definition-only Join key with one State-owned occurrence
# identity and compiler-owned source-to-target projection.  The added identity,
# plan, control-resolution, reducer, and recovery-admission checks are the one
# typed path for both acyclic and cyclic Join execution; their reviewed net
# shape is ratcheted here without merging construction and recovery defenses.
[tool.mote_kernel.complexity_ratchet]
top_level_definitions = 704
type_definitions = 412
dataclass_types = 239
dataclass_fields = 671
decision_points = 2169
logical_clone_pairs = 16
statement_clone_pairs = 23
near_clone_pairs = 17
record_shape_clone_pairs = 25
thin_single_use_helpers = 1
single_use_private_dataclasses = 15
test_only_private_definitions = 0
function_definitions = 537
method_definitions = 227
nested_function_definitions = 20
semantic_nodes = 39890
cognitive_complexity = 2938
await_points = 93
exception_handlers = 75
attribute_writes = 87
task_creations = 12
max_cyclomatic_complexity = 81
max_cognitive_complexity = 133
max_nesting_depth = 6
internal_call_edges = 750
recursive_call_components = 5
max_call_fan_out = 23
max_call_chain_depth = 17
max_call_chain_cognitive = 315
cross_module_call_edges = 807
cross_module_call_pairs = 238
max_runtime_module_fan_out = 24
internal_import_edges = 360
import_cycle_components = 0
max_module_fan_out = 24
max_module_dependency_depth = 29
ambiguous_internal_dispatches = 58
transparent_private_definitions = 34
thin_single_use_methods = 11
low_usage_private_definitions = 182
linear_private_call_chain_links = 35
production_unreferenced_definitions = 10
low_cohesion_classes = 2
max_methods_per_class = 27
max_fields_per_class = 33
max_class_components = 2
complexity_hotspots = 78
stateful_async_hotspots = 6
unused_private_definitions = 0
unread_private_fields = 0
unconsumed_internal_async_calls = 0
unowned_internal_coroutine_handles = 0
orphaned_task_handles = 0

# Proven violations have no baseline and no exception inventory.
[tool.mote_kernel.complexity_health]
import_cycle_components = 0
test_only_private_definitions = 0
unused_private_definitions = 0
unread_private_fields = 0
unconsumed_internal_async_calls = 0
unowned_internal_coroutine_handles = 0
orphaned_task_handles = 0

[tool.pyright]
include = ["src", "tests", "example"]
exclude = ["tests/typing_negative"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
