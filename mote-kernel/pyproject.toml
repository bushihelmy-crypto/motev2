[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mote-kernel"
dynamic = ["version"]
description = "A durable, state-machine-driven agent kernel."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Mote contributors" }]
keywords = ["agent", "ai", "workflow", "state-machine", "durable-execution"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "detect-secrets>=1.5",
  "hatchling>=1.27",
  "pip-audit>=2.8",
  "pre-commit>=4.0",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "twine>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mote_kernel"]
artifacts = ["src/mote_kernel/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/example/__init__.py",
  "/example/graph",
  "/docs",
  "/third_party_licenses",
  "/AGENTS.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
  "/README.zh-CN.md",
  "/pyproject.toml",
]

[tool.hatch.version]
path = "src/mote_kernel/__init__.py"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "strict"

[tool.coverage.run]
branch = true
source = ["mote_kernel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
extend-exclude = ["example/**/*.md"]
line-length = 120
src = ["src", "tests", "example"]
target-version = "py311"

[tool.ruff.lint]
select = ["A", "ANN", "ASYNC", "B", "C4", "E", "F", "FA", "I", "N", "PERF", "PIE", "PTH", "RET", "RUF", "SIM", "T20", "UP", "W"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]
"tests/execution/test_graph_examples.py" = ["RUF001"]
"example/**/*.py" = ["RUF001", "RUF002", "T201"]
"src/mote_kernel/logging/__init__.py" = ["A005"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

# High-recall indicators are independently ratcheted: every improvement becomes
# the new ceiling, while regressions require an explicit architecture decision.
[tool.mote_kernel.complexity_ratchet]
top_level_definitions = 520
type_definitions = 309
dataclass_types = 183
dataclass_fields = 504
decision_points = 1345
logical_clone_pairs = 13
statement_clone_pairs = 7
near_clone_pairs = 9
record_shape_clone_pairs = 20
thin_single_use_helpers = 1
single_use_private_dataclasses = 9
test_only_private_definitions = 0
function_definitions = 394
method_definitions = 162
nested_function_definitions = 21
semantic_nodes = 27948
cognitive_complexity = 1914
await_points = 85
exception_handlers = 46
attribute_writes = 86
task_creations = 12
max_cyclomatic_complexity = 70
max_cognitive_complexity = 110
max_nesting_depth = 6
internal_call_edges = 608
recursive_call_components = 5
max_call_fan_out = 18
max_call_chain_depth = 17
max_call_chain_cognitive = 319
internal_import_edges = 317
import_cycle_components = 0
max_module_fan_out = 24
max_module_dependency_depth = 28
ambiguous_internal_dispatches = 46
transparent_private_definitions = 28
thin_single_use_methods = 12
low_usage_private_definitions = 133
linear_private_call_chain_links = 31
production_unreferenced_definitions = 9
low_cohesion_classes = 1
max_methods_per_class = 26
max_fields_per_class = 32
max_class_components = 5
complexity_hotspots = 47
stateful_async_hotspots = 6
unused_private_definitions = 0
unread_private_fields = 0
unconsumed_internal_async_calls = 0
unowned_internal_coroutine_handles = 0
orphaned_task_handles = 0

# Proven violations have no baseline and no exception inventory.
[tool.mote_kernel.complexity_health]
import_cycle_components = 0
test_only_private_definitions = 0
unused_private_definitions = 0
unread_private_fields = 0
unconsumed_internal_async_calls = 0
unowned_internal_coroutine_handles = 0
orphaned_task_handles = 0

[tool.pyright]
include = ["src", "tests", "example"]
exclude = ["tests/typing_negative"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"
