version: 2
updates:
  - package-ecosystem: pip
    directory: /mote-kernel
    schedule:
      interval: weekly
    groups:
      kernel-development-dependencies:
        dependency-type: development
  - package-ecosystem: cargo
    directory: /mote-infra/local
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /mote-infra/cloudflare/ts
    schedule:
      interval: weekly
    groups:
      cloudflare-typescript-development-dependencies:
        dependency-type: development
  - package-ecosystem: pip
    directory: /mote-infra/cloudflare/python
    schedule:
      interval: weekly
    groups:
      cloudflare-python-development-dependencies:
        dependency-type: development
  - package-ecosystem: npm
    directory: /mote-infra/cloudflare/python
    schedule:
      interval: weekly
    groups:
      cloudflare-python-wrangler:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
