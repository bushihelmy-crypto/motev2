name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mote-kernel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mote-kernel/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pre-commit run --all-files
        working-directory: .
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: pyright
      - run: python -m pytest --cov=mote_kernel --cov-report=term-missing --cov-report=xml
      - run: python -m build
      - run: python -m twine check dist/*

  kernel-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: mote-kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: mote-kernel/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest

  infra-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mote-infra/local
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt
      - run: make check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.7
      - run: cargo deny check

  infra-current-rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mote-infra/local
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo +stable test --locked --all-targets --all-features

  cloudflare-ts-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mote-infra/cloudflare/ts
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mote-infra/cloudflare/ts/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mote-infra/cloudflare/ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:ci

  cloudflare-ts-node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19", "24", "26"]
    defaults:
      run:
        working-directory: mote-infra/cloudflare/ts
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mote-infra/cloudflare/ts/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: mote-infra/cloudflare/ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  cloudflare-python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mote-infra/cloudflare/python
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: mote-infra/cloudflare/python/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: mote-infra/cloudflare/python/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mote-infra/cloudflare/python/pnpm-lock.yaml
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - run: make check
