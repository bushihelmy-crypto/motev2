name: Gateway quality

on:
  push:
    paths:
      - mote-runtime/gateway/**
      - conformance/**
      - .github/workflows/gateway.yml
  pull_request:
    paths:
      - mote-runtime/gateway/**
      - conformance/**
      - .github/workflows/gateway.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-quality:
    name: Go baseline quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mote-runtime/gateway
    env:
      # Never download or silently switch toolchains in CI. This job uses the
      # module's pinned baseline; compatibility versions are tested below.
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: mote-runtime/gateway/.go-version
          cache-dependency-path: mote-runtime/gateway/src/go.mod

      - name: Set up secret scanner
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install secret scanner
        env:
          SCANNER_SPEC: "==1.5.0"
        run: python -m pip install --disable-pip-version-check --no-warn-script-location detect-secrets${SCANNER_SPEC}

      - name: Run complete Gateway gate
        run: make check

  gateway-tests:
    name: Go ${{ matrix.go-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.6", "1.27.1"]
    defaults:
      run:
        working-directory: mote-runtime/gateway
    env:
      # Compatibility versions are selected by this matrix. Each job still
      # uses the exact binary installed by setup-go; no implicit toolchain
      # download or replacement is allowed.
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: mote-runtime/gateway/src/go.mod

      - name: Run unit and integration tests
        run: make test-unit test-integration
