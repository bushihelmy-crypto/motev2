name: Release Mote Kernel artifacts

on:
  push:
    tags:
      - "kernel-v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-kernel-artifacts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mote-kernel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - name: Verify wheel in an isolated environment
        run: |
          python -m venv /tmp/mote-kernel-wheel-check
          /tmp/mote-kernel-wheel-check/bin/python -m pip install dist/*.whl
          /tmp/mote-kernel-wheel-check/bin/python -c "import mote_kernel; print(mote_kernel.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: mote-kernel-python-distributions
          path: mote-kernel/dist/
