name: Feature request
description: Propose a concrete capability or change
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete use case cannot be expressed today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Architecture boundaries
      description: Who owns the state, lifecycle, persistence, recovery, and cross-language contract?
    validations:
      required: true
