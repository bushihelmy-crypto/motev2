version: 2

project_name: mote-gateway

before:
  hooks:
    - go -C src mod download

builds:
  - id: gateway
    dir: src
    main: ./cmd/gateway
    binary: gateway
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/bushihelmy-crypto/motev2/mote-runtime/gateway/internal/buildinfo.Version={{ .Version }}
      - -X github.com/bushihelmy-crypto/motev2/mote-runtime/gateway/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/bushihelmy-crypto/motev2/mote-runtime/gateway/internal/buildinfo.Date={{ .Date }}

archives:
  - id: gateway
    builds: [gateway]
    formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
