repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^mote-kernel/(src|tests)/.*\.py$
      - id: ruff-format
        files: ^mote-kernel/(src|tests)/.*\.py$
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --manifest-path mote-infra/local/Cargo.toml --all -- --check
        language: system
        pass_filenames: false
        files: ^mote-infra/local/.*\.rs$
      - id: cloudflare-ts-static
        name: Cloudflare TypeScript static checks
        entry: pnpm --dir mote-infra/cloudflare/ts run check:static
        language: system
        pass_filenames: false
        files: ^mote-infra/cloudflare/ts/
      - id: cloudflare-python-static
        name: Cloudflare Python static checks
        entry: make -C mote-infra/cloudflare/python static
        language: system
        pass_filenames: false
        files: ^mote-infra/cloudflare/python/
      - id: detect-secrets
        name: detect secrets
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
        exclude: ^(\.secrets\.baseline|mote-kernel/third_party_licenses/|mote-infra/local/third_party_licenses/|mote-infra/cloudflare/(ts/pnpm-lock\.yaml|python/(pnpm-lock\.yaml|pylock\.toml)))
