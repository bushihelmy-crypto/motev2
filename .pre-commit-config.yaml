repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^mote-kernel/(src|tests|example)/.*\.py$
      - id: ruff-format
        files: ^mote-kernel/(src|tests|example)/.*\.py$
  - repo: local
    hooks:
      - id: kernel-complexity
        name: kernel structural complexity ratchet
        entry: make -C mote-kernel complexity-ratchet
        language: system
        pass_filenames: false
        files: ^mote-kernel/(pyproject\.toml|src/.*\.py|tests/.*\.py)$
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --manifest-path mote-infra/persistence/local/Cargo.toml --all -- --check
        language: system
        pass_filenames: false
        files: ^mote-infra/persistence/local/.*\.rs$
      - id: container-cloudflare-static
        name: Cloudflare Container static checks
        entry: pnpm --dir mote-resource/container/cloudflare run check:static
        language: system
        pass_filenames: false
        files: ^mote-resource/container/cloudflare/
      - id: detect-secrets
        name: detect secrets
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
        exclude: ^(\.secrets\.baseline|mote-kernel/third_party_licenses/|mote-infra/persistence/local/third_party_licenses/|mote-resource/container/cloudflare/pnpm-lock\.yaml)
